[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senate-forecast-dashboard"
version = "0.1.0"
description = "Senate forecast dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "streamlit>=1.32",
    "plotly>=5.18",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
